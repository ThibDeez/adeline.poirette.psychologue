# Vérifie le projet sur GitHub à chaque push et pull request.
# Ce workflow ne publie pas le site et ne modifie pas le dépôt.
name: Vérifications
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
